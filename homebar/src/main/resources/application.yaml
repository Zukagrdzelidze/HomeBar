server:
  port: ${PORT:8080}
  # Render terminates HTTPS in front of the app; trust its X-Forwarded-* headers.
  forward-headers-strategy: framework

spring:
  application:
    name: homebar
  # Defaults match compose.yaml for local runs; Render sets the real values.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homebar}
    username: ${DB_USER:homebar}
    password: ${DB_PASSWORD:homebar}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  servlet:
    multipart:
      # Generous transport limits so an oversized photo is read fully and rejected with a clear 400;
      # the real 5 MB limit is ImageFormat.MAX_BYTES.
      max-file-size: 20MB
      max-request-size: 20MB
  web:
    error:
      include-message: always
